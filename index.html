<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1a2f">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="dot"></span><span>JARVIS</span></div>
      <button id="orb" class="orb" type="button" aria-label="О приложении" title="О приложении"></button>
      <div class="export">
        <button id="export-week" class="ghost" type="button">Сохранить неделю</button>
        <button id="test-notify" class="ghost" type="button">Проверить нотификацию</button>
      </div>
    </header>

    <nav class="days" id="days"></nav>

    <section class="day">
      <div class="day-head">
        <button id="prev" class="ghost" type="button">‹</button>
        <div id="day-label" class="day-label"></div>
        <button id="next" class="ghost" type="button">›</button>
      </div>
      <div class="table" id="table"></div>
      <div class="mood" id="mood"></div>
    </section>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="dialog">
      <h2 id="dlg-title"></h2>
      <div class="chips" id="dlg-chips"></div>
      <input id="dlg-text" class="text" placeholder="Своими словами…">
      <div class="rating-block">
        <div class="rating-label">Удовольствие</div>
        <div class="rating" id="dlg-pleasure"></div>
      </div>
      <div class="rating-block">
        <div class="rating-label">Важность</div>
        <div class="rating" id="dlg-importance"></div>
      </div>
      <div class="dlg-actions">
        <button id="dlg-cancel" class="ghost" type="button">Отмена</button>
        <button id="dlg-save" class="primary" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
    }
  </script>
  <div class="modal" id="about" hidden>
    <div class="dialog about-dialog">
      <h2>О приложении</h2>
      <div class="about-row"><span>Версия</span><b id="about-version">—</b></div>
      <div class="about-row"><span>Сборка</span><b id="about-build">—</b></div>
      <div class="about-row"><span>Кэш</span><b id="about-cache">—</b></div>
      <div class="dlg-actions">
        <button id="about-close" class="primary" type="button">Закрыть</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=8"></script>
</body>
</html>
