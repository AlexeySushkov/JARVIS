name: notify

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JARVIS reminders
        run: |
          curl -fsS -X GET "https://jarvis-zeta-jet.vercel.app/api/notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
